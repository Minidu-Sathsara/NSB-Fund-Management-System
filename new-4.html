<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Slider</title>
  <!-- Bootstrap CSS -->
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Style for each story item */
    .story-item {
      width: 100px;
      height: 200px;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      margin: 0 10px;
    }
    /* Story image styling */
    .story-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Overlay for text and icons */
    .story-overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 5px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      text-align: center;
      font-size: 12px;
    }
    .story-icon {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 3px 5px;
      border-radius: 50%;
      font-size: 10px;
    }
    .create-story {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e0e0e0;
      font-size: 16px;
      font-weight: bold;
      color: #007bff;
    }
  </style>
</head>
<body>

<div id="storyCarousel" class="carousel slide" data-ride="carousel" data-interval="false">
  <div class="carousel-inner d-flex flex-row">
    <!-- Create Story Card -->
    <div class="carousel-item active">
      <div class="story-item create-story">
        <span>+ Create Story</span>
      </div>
    </div>
    <!-- Story Cards -->
    <div class="carousel-item">
      <div class="story-item">
        <img src="path/to/your/image1.jpg" alt="Story 1">
        <div class="story-icon">SENSE</div>
        <div class="story-overlay">Sense Imagery</div>
      </div>
    </div>
    <div class="carousel-item">
      <div class="story-item">
        <img src="path/to/your/image2.jpg" alt="Story 2">
        <div class="story-icon">InStyle</div>
        <div class="story-overlay">InStyle</div>
      </div>
    </div>
    <!-- Add more items as needed -->
  </div>
  <!-- Carousel controls -->
  <a class="carousel-control-prev" href="#storyCarousel" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="carousel-control-next" href="#storyCarousel" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </a>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
